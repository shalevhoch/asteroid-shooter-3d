<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Asteroid Shooter 3D — defend Earth. A browser port of a classic university JOGL game." />
    <title>Asteroid Shooter 3D</title>
    <link rel="icon" type="image/svg+xml" href="/icon.svg" />
    <meta name="theme-color" content="#0f1a14" />
    <style>
      html, body { margin: 0; height: 100%; background: #000; overflow: hidden; font-family: 'Segoe UI', Arial, sans-serif; color: #f0d9a8; }
      #app { position: fixed; inset: 0; }
      #app canvas { display: block; cursor: crosshair; }
      #status { position: fixed; left: 12px; bottom: 8px; z-index: 1; font-size: 11px; color: #6f7a8e; pointer-events: none; }
      #help { position: fixed; right: 12px; top: 12px; background: rgba(15, 26, 20, 0.78); border: 1px solid #3a9d6e; border-radius: 8px; padding: 8px 12px; font-size: 12px; pointer-events: none; }
      #help h2 { font-size: 13px; margin: 0 0 6px; }
      #help td { padding: 1px 8px 1px 0; color: #d8dce6; }
      #help td:first-child { color: #f0d9a8; white-space: nowrap; }
      #help p { margin: 6px 0 0; color: #a8c9b0; }
      #hud { position: fixed; inset: 0; pointer-events: none; text-shadow: 0 1px 4px #000; font-variant-numeric: tabular-nums; }
      #hud .tl { position: absolute; left: 16px; top: 12px; }
      #hud .score { font-size: 34px; font-weight: 600; letter-spacing: 0.03em; }
      #hud .best { font-size: 12px; color: #a8c9b0; }
      #hud .combo { margin-top: 4px; font-size: 15px; font-weight: 600; letter-spacing: 0.1em; color: #7fffd4; }
      #hud .wave { margin-top: 4px; font-size: 13px; letter-spacing: 0.1em; color: #f0d9a8; }
      #banner { position: fixed; left: 0; right: 0; top: 26%; text-align: center; pointer-events: none; text-shadow: 0 2px 10px #000; opacity: 0; transition: opacity 0.4s; }
      #banner.on { opacity: 1; }
      #banner h2 { margin: 0; font-size: clamp(1.6rem, 4vw, 2.6rem); letter-spacing: 0.06em; }
      #banner p { margin: 6px 0 0; color: #a8c9b0; font-size: 15px; }
      #overlay .diff { display: flex; gap: 8px; justify-content: center; margin: 10px 0 2px; }
      #overlay .diff button { margin: 0; font-size: 14px; padding: 6px 12px; background: transparent; border-color: #3a9d6e; color: #c8d0dc; }
      #overlay .diff button.on { background: #2b2416; border-color: #f0d9a8; color: #f0d9a8; }
      #overlay details.settings { margin: 12px auto 0; text-align: left; font-size: 14px; }
      #overlay details.settings summary { cursor: pointer; color: #f0d9a8; text-align: center; }
      #overlay details.settings table { margin: 8px auto 0; border-collapse: collapse; }
      #overlay details.settings td { padding: 2px 10px; color: #d8dce6; }
      #overlay details.settings td.ctl { text-align: right; white-space: nowrap; }
      #overlay details.settings button { margin: 0 2px; font-size: 13px; padding: 2px 10px; background: transparent; border-color: #3a9d6e; color: #f0d9a8; }
      #overlay details.settings button.val { min-width: 84px; }
      #overlay details.settings span.val { display: inline-block; min-width: 52px; text-align: center; }
      #overlay .row { display: flex; gap: 10px; justify-content: center; }
      #hud .bars { position: absolute; left: 50%; bottom: 26px; transform: translateX(-50%); display: flex; gap: 14px; }
      #hud .bar { width: 150px; height: 8px; background: rgba(255, 255, 255, 0.12); border-radius: 4px; position: relative; }
      #hud .bar span { position: absolute; top: -15px; left: 0; font-size: 10px; letter-spacing: 0.12em; color: #a8c9b0; }
      #hud .bar i { display: block; height: 100%; border-radius: 4px; background: #6fd08c; transition: width 0.15s; }
      #hud .bar.earth i { background: #5fa8ff; }
      #hud .bar.fuel i { background: #f0c060; }
      #hud .bar.low i { background: #ff5a4a; animation: blink 0.8s infinite; }
      #hud .br { position: absolute; right: 16px; bottom: 22px; text-align: right; font-size: 13px; letter-spacing: 0.08em; line-height: 1.6; }
      #hitflash { position: fixed; inset: 0; pointer-events: none; opacity: 0; background: radial-gradient(ellipse at center, rgba(255, 60, 30, 0) 35%, rgba(255, 40, 20, 0.95) 100%); }
      #threat { position: fixed; inset: 0; width: 100%; height: 100%; pointer-events: none; }
      #hud .impact { position: absolute; left: 0; right: 0; top: 12px; text-align: center; font-size: 15px; font-weight: 600; letter-spacing: 0.14em; color: #e8e070; }
      #hud .impact[data-urgency='warning'] { color: #ffb347; }
      #hud .impact[data-urgency='critical'] { color: #ff5a4a; animation: blink 0.7s infinite; }
      #hud .warn { position: absolute; left: 0; right: 0; top: 18%; text-align: center; color: #ff7a5a; font-weight: 600; letter-spacing: 0.12em; animation: blink 1s infinite; }
      #hud .crosshair { position: absolute; left: 50%; top: 50%; transform: translate(-50%, -50%); font-size: 28px; color: rgba(160, 255, 200, 0.75); }
      @keyframes blink { 50% { opacity: 0.45; } }
      #overlay { position: fixed; inset: 0; display: flex; align-items: center; justify-content: center; }
      #overlay[data-phase='playing'] { display: none; }
      #overlay .card { max-height: 94vh; overflow-y: auto; background: rgba(15, 26, 20, 0.86); border: 2px solid #3a9d6e; border-radius: 16px; padding: 22px 30px; text-align: center; max-width: 460px; }
      #overlay .card.wide { max-width: 800px; }
      #overlay h1 { margin: 0 0 10px; font-size: clamp(1.4rem, 3.4vw, 2.2rem); }
      #overlay p { color: #c8d0dc; margin: 8px 0; }
      #overlay .dim { color: #a8c9b0; font-size: 13px; }
      #overlay button { margin: 12px 0 4px; font: inherit; font-size: 17px; padding: 9px 26px; border-radius: 8px; border: 1px solid #f0d9a8; background: #2b2416; color: #f0d9a8; cursor: pointer; }
      #overlay button:hover { background: #3d331f; }
      #overlay .final { font-size: 52px; font-weight: 700; }
      #overlay .newbest { color: #7fffb0; font-weight: 700; letter-spacing: 0.15em; }
      #overlay .stats { margin: 10px auto; font-size: 14px; color: #d8dce6; }
      #overlay .stats td { padding: 2px 10px; text-align: left; }
      #overlay .stats td:last-child { text-align: right; color: #f0d9a8; }
      #overlay .stats th { font-size: 12px; letter-spacing: 0.12em; text-transform: uppercase; color: #a8c9b0; padding-bottom: 4px; }
      #overlay .stats tr.total td { border-top: 1px solid #ffffff33; font-weight: 600; color: #fff; }
      #overlay .summary { display: flex; flex-wrap: wrap; gap: 6px 18px; justify-content: center; align-items: flex-start; }
      #overlay .top td { padding: 1px 6px; text-align: right; }
      #overlay .top td:last-child { color: #8890a0; font-size: 12px; }
      #overlay .top tr.me td { color: #7fffd4; font-weight: 600; }
      #overlay a { color: #a8c9b0; }
      /* Narrow / short screens (P21): the card moves left and the controls list narrows, so they never overlap. */
      @media (max-width: 1240px) {
        #overlay { justify-content: flex-start; padding-left: 12px; box-sizing: border-box; }
        #overlay .card { max-width: min(460px, calc(100vw - 404px)); padding: 16px 18px; box-sizing: border-box; }
        #help { width: 340px; box-sizing: border-box; font-size: 11px; }
        #help td:last-child { white-space: normal; }
      }
      @media (max-height: 720px) {
        #help { padding: 6px 10px; font-size: 10px; max-height: calc(100vh - 24px); overflow: hidden; }
        #help td { padding: 0 6px 0 0; line-height: 1.2; }
        #help h2 { margin-bottom: 2px; }
      }
      /* Loading screen (P20) */
      body.loading #hud, body.loading #help, body.loading #status, body.loading #threat { display: none; }
      #loading .loadbar { width: 260px; height: 8px; margin: 10px auto; background: rgba(255, 255, 255, 0.12); border-radius: 4px; overflow: hidden; }
      #loading .loadbar i { display: block; width: 0; height: 100%; background: #6fd08c; transition: width 0.2s; }
      /* Touch controls (P15) */
      .touch { position: fixed; inset: 0; z-index: 2; display: none; touch-action: none; user-select: none; -webkit-user-select: none; -webkit-touch-callout: none; pointer-events: none; }
      .touch > * { pointer-events: auto; }
      .t-stick-zone { position: absolute; left: 0; top: 15%; width: 48%; bottom: 0; }
      .t-stick-base { position: absolute; width: 128px; height: 128px; margin: -64px 0 0 -64px; border-radius: 50%; border: 2px solid rgba(240, 217, 168, 0.45); background: rgba(15, 26, 20, 0.25); display: none; pointer-events: none !important; }
      .t-stick-base.on { display: block; }
      .t-stick-knob { position: absolute; left: 39px; top: 39px; width: 50px; height: 50px; border-radius: 50%; background: rgba(240, 217, 168, 0.35); border: 2px solid rgba(240, 217, 168, 0.7); }
      .t-stick-knob.live { background: rgba(240, 217, 168, 0.6); }
      .t-slider { position: absolute; right: 14px; bottom: 90px; width: 46px; height: 42vh; border-radius: 23px; border: 2px solid #3a9d6e; background: rgba(15, 26, 20, 0.45); display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 6px 0; box-sizing: border-box; font-size: 11px; color: #a8c9b0; }
      .t-mark { pointer-events: none; }
      .t-thumb { position: absolute; left: 4px; right: 4px; height: 16px; margin-bottom: -8px; border-radius: 8px; background: #f0d9a8; opacity: 0.85; pointer-events: none; }
      .t-thumb.unset { opacity: 0.45; }
      .t-btn { position: absolute; display: flex; align-items: center; justify-content: center; border-radius: 50%; border: 2px solid #f0d9a8; background: rgba(43, 36, 22, 0.55); color: #f0d9a8; font-weight: 600; letter-spacing: 0.04em; }
      .t-btn.on { background: rgba(240, 217, 168, 0.45); color: #0f1a14; }
      .t-fire { right: 84px; bottom: 96px; width: 104px; height: 104px; font-size: 15px; }
      .t-rocket { right: 92px; bottom: 214px; width: 76px; height: 76px; font-size: 11px; }
      .t-turbo { right: 200px; bottom: 100px; width: 70px; height: 70px; font-size: 11px; border-color: #3a9d6e; }
      .t-pause { position: absolute; top: 10px; left: 50%; width: 44px; height: 44px; margin-left: -22px; border-radius: 50%; border: 2px solid #3a9d6e; background: rgba(15, 26, 20, 0.6); color: #f0d9a8; display: flex; align-items: center; justify-content: center; font-size: 18px; }
      body.touch-mode #status { display: none; }
      #rotate { display: none; }
      @media (orientation: portrait) {
        body.touch-mode #rotate { display: flex; position: fixed; inset: 0; z-index: 5; align-items: center; justify-content: center; text-align: center; padding: 30px; background: rgba(15, 26, 20, 0.92); color: #f0d9a8; font-size: 20px; }
      }
      #toast { position: fixed; left: 50%; top: 64px; transform: translate(-50%, -12px); z-index: 3; background: rgba(15, 26, 20, 0.92); border: 2px solid #3a9d6e; border-radius: 12px; padding: 8px 16px; text-align: center; opacity: 0; transition: opacity 0.4s, transform 0.4s; pointer-events: none; }
      #toast.on { opacity: 1; transform: translate(-50%, 0); }
      #toast b { display: block; color: #f0d9a8; font-size: 15px; }
      #toast span { color: #a8c9b0; font-size: 12px; }
      #overlay details.ach td { vertical-align: top; padding: 3px 8px; }
      #overlay details.ach tr.locked b { color: #a8c9b0; font-weight: normal; }
      #overlay p.unlocked { color: #f0d9a8; margin: 6px 0; }
    </style>
  </head>
  <body class="loading">
    <div id="app"></div>
    <div id="hitflash"></div>
    <div id="toast"></div>
    <div id="rotate">↻ Turn your device sideways to play</div>
    <canvas id="threat"></canvas>
    <div id="hud"></div>
    <div id="help"></div>
    <div id="status"></div>
    <div id="banner"><h2></h2><p></p></div>
    <div id="overlay"><div class="card" id="loading"><h1>☄️ Asteroid Shooter 3D</h1><p>Loading <span id="loadpct">0%</span></p><div class="loadbar"><i></i></div><p class="dim">Asteroids are falling toward Earth. Get ready.</p></div></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
