# Build the Vite app and publish it with GitHub Pages (Actions source).
# shalevhoch's user site carries the games.hochgi.com CNAME, so this project page is served at
# https://games.hochgi.com/asteroid-shooter-3d/ — the same mechanism as /conquarrow/.
name: pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    if: github.repository == 'shalevhoch/asteroid-shooter-3d'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build:pages
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/web/dist

  deploy:
    if: github.repository == 'shalevhoch/asteroid-shooter-3d'
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
